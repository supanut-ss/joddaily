<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14201b" media="(prefers-color-scheme: dark)">
<title>จดจ่าย</title>
<link rel="icon" type="image/png" href="favicon-48.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@500;600;700&family=Noto+Sans+Thai:wght@400;500;600&display=swap">
<style>
  /* Personal ledger LIFF page. Tokens follow the "จดจ่าย" design: green primary, expenses in the normal text colour (− sign),
     income in green (+ sign), red only for over-budget and destructive actions. */
  :root {
    --bg:#F3F6F4; --card:#FFFFFF; --card-2:#EAF1ED; --text:#0F1F18; --muted:#55665D; --line:#D9E4DE;
    --primary:#047857; --primary-soft:#D6F0E4; --on-primary:#FFFFFF;
    --income:#047857; --danger:#C62828; --danger-soft:#FBE3E1; --warn:#B45309; --warn-soft:#FDF0DC;
    --c-food:#059669; --c-transport:#0284C7; --c-bills:#D97706; --c-shopping:#7C3AED; --c-housing:#E11D48;
    --c-health:#0D9488; --c-fun:#DB2777; --c-other:#64748B;
    --f-display:"IBM Plex Sans Thai","Noto Sans Thai",system-ui,sans-serif;
    --f-body:"Noto Sans Thai",system-ui,-apple-system,"Segoe UI",sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg:#0C1411; --card:#14201B; --card-2:#1B2A23; --text:#E7F0EB; --muted:#9AB0A4; --line:#26372F;
      --primary:#34D399; --primary-soft:#123A2B; --on-primary:#06251A;
      --income:#34D399; --danger:#F87171; --danger-soft:#3A1A1A; --warn:#FBBF24; --warn-soft:#3A2C10;
      --c-food:#10B981; --c-transport:#0EA5E9; --c-bills:#F59E0B; --c-shopping:#8B5CF6; --c-housing:#F43F5E;
      --c-health:#14B8A6; --c-fun:#EC4899; --c-other:#64748B;
      color-scheme:dark;
    }
  }
  * { box-sizing:border-box; }
  [hidden] { display:none !important; }
  html { -webkit-text-size-adjust:100%; }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.5 var(--f-body); -webkit-tap-highlight-color:transparent;
         padding:0 env(safe-area-inset-right) 0 env(safe-area-inset-left); }
  button, input, select { font:inherit; color:inherit; }
  button { cursor:pointer; touch-action:manipulation; }
  button:disabled { opacity:.5; }
  button:focus-visible, input:focus-visible, select:focus-visible { outline:3px solid var(--primary); outline-offset:2px; }
  .num { font-variant-numeric:tabular-nums; }
  h1, h2, h3 { font-family:var(--f-display); margin:0; line-height:1.3; }
  h3 { font-size:15px; font-weight:600; }

  .bar { position:sticky; top:0; z-index:10; display:flex; align-items:center; gap:6px; min-height:52px; background:var(--card); border-bottom:1px solid var(--line);
         padding:calc(6px + env(safe-area-inset-top)) max(10px, calc((100% - 560px) / 2 + 10px)) 6px; }
  .bar .ttl { flex:1; font-family:var(--f-display); font-weight:600; font-size:17px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  main { max-width:560px; margin:0 auto; padding:12px 12px calc(96px + env(safe-area-inset-bottom)); display:grid; gap:12px; }
  body.no-tabs main { padding-bottom:calc(24px + env(safe-area-inset-bottom)); }

  svg.i { width:20px; height:20px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; flex:none; }
  .ib { display:inline-grid; place-items:center; width:44px; height:44px; padding:0; border:0; border-radius:12px; background:transparent; color:var(--text); flex:none; }
  .ib:active { background:var(--card-2); }

  .card { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:14px; display:grid; gap:12px; }
  .card-h { display:flex; justify-content:space-between; align-items:center; gap:8px; }
  .link { border:0; background:none; color:var(--primary); font-weight:600; font-size:14px; padding:8px 4px; min-height:36px; }
  .muted { color:var(--muted); }
  .small { font-size:13px; }

  .sum { background:var(--primary); color:var(--on-primary); border-radius:16px; padding:16px; display:grid; gap:12px; }
  .sum .lbl { font-size:13px; opacity:.85; }
  .sum .big { font-family:var(--f-display); font-size:32px; font-weight:700; line-height:1.15; }
  .sum .row { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .sum .row > div { background:rgba(255,255,255,.15); border-radius:12px; padding:8px 12px; }
  .sum .row b { display:block; font-family:var(--f-display); font-size:16px; }

  .months { display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .months strong { font-family:var(--f-display); font-size:16px; }
  .months .ib { background:var(--card); border:1px solid var(--line); }

  .bud { display:grid; gap:6px; }
  .bud .t { display:flex; justify-content:space-between; gap:8px; font-size:14px; }
  .track { height:8px; background:var(--card-2); border-radius:99px; overflow:hidden; }
  .track i { display:block; height:100%; border-radius:99px; background:var(--primary); }
  .track i.warn { background:var(--warn); } .track i.over { background:var(--danger); }
  .pill { display:inline-block; font-size:11.5px; font-weight:600; padding:1px 8px; border-radius:99px; white-space:nowrap; background:var(--card-2); color:var(--muted); }
  .pill.warn { background:var(--warn-soft); color:var(--warn); } .pill.over { background:var(--danger-soft); color:var(--danger); }
  .pill.ok { background:var(--primary-soft); color:var(--primary); }

  .tx { display:grid; grid-template-columns:40px 1fr auto; gap:12px; align-items:center; width:100%; padding:6px 0; border:0; background:none; text-align:left; min-height:52px; }
  .tx + .tx { border-top:1px solid var(--line); }
  .tx .grow { min-width:0; }
  .tx .n { font-weight:600; line-height:1.35; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .tx .s { font-size:12.5px; color:var(--muted); }
  .tx .v { font-family:var(--f-display); font-weight:600; text-align:right; display:grid; justify-items:end; gap:2px; }
  .in { color:var(--income); }
  .ic { width:40px; height:40px; border-radius:12px; display:grid; place-items:center; color:#fff; }
  .ic svg.i { width:19px; height:19px; }
  .av { width:40px; height:40px; border-radius:12px; display:grid; place-items:center; background:var(--card-2); color:var(--primary); font-family:var(--f-display); font-weight:700; font-size:17px; }
  .daysep { display:flex; justify-content:space-between; font-size:13px; font-weight:600; color:var(--muted); padding:4px 2px 0; }
  .empty { text-align:center; color:var(--muted); padding:20px 8px; display:grid; gap:10px; justify-items:center; }

  .fab { position:fixed; right:max(16px, calc((100% - 560px) / 2 + 16px)); bottom:calc(84px + env(safe-area-inset-bottom)); width:56px; height:56px; border:0; border-radius:18px;
         background:var(--primary); color:var(--on-primary); display:grid; place-items:center; box-shadow:0 10px 22px -8px rgba(4,120,87,.7); z-index:9; }
  .fab svg.i { width:26px; height:26px; }

  .tabs { position:fixed; left:0; right:0; bottom:0; z-index:10; background:var(--card); border-top:1px solid var(--line);
          display:grid; grid-template-columns:repeat(4,1fr); padding:0 max(env(safe-area-inset-right), calc((100% - 560px) / 2)) env(safe-area-inset-bottom) max(env(safe-area-inset-left), calc((100% - 560px) / 2)); }
  .tabs button { border:0; background:none; color:var(--muted); display:grid; justify-items:center; gap:2px; padding:8px 2px; font-size:12px; min-height:60px; }
  .tabs button[aria-current="page"] { color:var(--primary); font-weight:600; }
  body.no-tabs .tabs, body.no-tabs .fab { display:none; }

  /* add / edit form */
  .seg { display:grid; grid-auto-flow:column; grid-auto-columns:1fr; background:var(--card-2); border-radius:12px; padding:3px; }
  .seg button { border:0; background:transparent; color:var(--muted); font-weight:600; padding:8px; border-radius:10px; min-height:40px; }
  .seg button[aria-pressed="true"] { background:var(--card); color:var(--text); box-shadow:0 1px 3px rgba(0,0,0,.14); }
  .amount { text-align:center; display:grid; gap:2px; }
  .amount small { color:var(--muted); font-size:12.5px; }
  .amount output { font-family:var(--f-display); font-size:clamp(34px,10vw,44px); font-weight:700; line-height:1.15; }
  .cats { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; }
  .cat { border:1px solid var(--line); background:var(--card); border-radius:14px; padding:8px 2px; display:grid; justify-items:center; gap:4px; font-size:12.5px; min-height:68px; }
  .cat .ic { width:32px; height:32px; border-radius:10px; }
  .cat .ic svg.i { width:16px; height:16px; }
  .cat[aria-pressed="true"] { border-color:var(--primary); background:var(--primary-soft); font-weight:600; }
  .fields { display:grid; grid-template-columns:auto 1fr; gap:8px; }
  .field { display:grid; gap:4px; }
  .field label, .lbl2 { font-size:13px; color:var(--muted); font-weight:500; }
  .inp { width:100%; min-height:44px; border:1px solid var(--line); background:var(--card); border-radius:12px; padding:8px 12px; }
  .keys { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
  .keys button { border:0; border-radius:14px; background:var(--card); font-family:var(--f-display); font-size:21px; font-weight:600; min-height:52px; display:grid; place-items:center; }
  .keys button:active { background:var(--card-2); }
  .cta { width:100%; min-height:50px; border:0; border-radius:14px; background:var(--primary); color:var(--on-primary); font-weight:700; font-size:16px; }
  .ghost { width:100%; min-height:46px; border:1px solid var(--line); border-radius:14px; background:transparent; font-weight:600; }
  .ghost.danger { color:var(--danger); border-color:var(--danger); }
  .err { color:var(--danger); font-size:14px; text-align:center; }
  .check { display:flex; align-items:center; gap:10px; min-height:44px; }
  .check input { width:22px; height:22px; accent-color:var(--primary); }

  /* report */
  .donut { display:grid; grid-template-columns:132px 1fr; gap:14px; align-items:center; }
  .donut svg { width:132px; height:132px; transform:rotate(-90deg); }
  .donut circle { fill:none; stroke-width:5; }
  .legend { display:grid; gap:6px; font-size:13px; }
  .legend div { display:grid; grid-template-columns:10px 1fr auto; gap:8px; align-items:center; }
  .legend i { width:10px; height:10px; border-radius:3px; }
  .bars { display:grid; gap:2px; align-items:end; height:96px; border-bottom:1px solid var(--line); }
  .bars i { display:block; background:var(--primary); border-radius:3px 3px 0 0; min-height:1px; opacity:.75; }
  .bars i.today { opacity:1; }
  .axis { display:flex; justify-content:space-between; font-size:11px; color:var(--muted); }

  .alert { display:flex; gap:10px; align-items:flex-start; background:var(--danger-soft); border-radius:14px; padding:12px 14px; font-size:14px; }
  .alert svg.i { color:var(--danger); }
  .alert b { display:block; }

  .toast { position:fixed; left:12px; right:12px; bottom:calc(84px + env(safe-area-inset-bottom)); max-width:536px; margin:0 auto; z-index:20; background:var(--text); color:var(--bg);
           border-radius:14px; padding:10px 8px 10px 14px; display:flex; justify-content:space-between; align-items:center; gap:8px; font-size:14px; }
  body.no-tabs .toast { bottom:calc(16px + env(safe-area-inset-bottom)); }
  .toast button { border:0; background:none; color:var(--primary-soft); font-weight:700; min-height:40px; padding:0 10px; }
  .loading { text-align:center; color:var(--muted); padding:40px 0; }

  @media (prefers-reduced-motion:no-preference) {
    .cat, .seg button, .keys button, .tabs button { transition:background-color .15s, border-color .15s, color .15s; }
  }
</style>
</head>
<body>
<header class="bar"><span id="backSlot"></span><span class="ttl" id="ttl">จดจ่าย</span><span id="actSlot"></span></header>
<main id="app"><div class="loading">กำลังโหลด…</div></main>
<button class="fab" id="fab" type="button" aria-label="จดรายการใหม่" hidden></button>
<nav class="tabs" id="tabs" aria-label="เมนูหลัก"></nav>
<div class="toast" id="toast" role="status" hidden><span id="toastMsg"></span><button type="button" id="toastAct" hidden></button></div>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script>
(function () {
  var API = '';  // the page is served by the API itself (wwwroot), so calls are same-origin
  var DEMO = /[?&]demo=1\b/.test(location.search); // local preview with sample data, no LINE login
  var app = document.getElementById('app');
  var idToken = null;

  // ───────── helpers ─────────
  // Build DOM with textContent only: notes and subscription names are typed by the user.
  function el(tag, props, children) {
    var e = document.createElement(tag);
    Object.keys(props || {}).forEach(function (k) {
      if (k === 'class') e.className = props[k];
      else if (k === 'text') e.textContent = props[k];
      else if (k.indexOf('on') === 0) e.addEventListener(k.slice(2), props[k]);
      else e.setAttribute(k, props[k]);
    });
    (children || []).forEach(function (c) { if (c) e.appendChild(typeof c === 'string' ? document.createTextNode(c) : c); });
    return e;
  }
  function baht(satang) {
    return (satang / 100).toLocaleString('th-TH', { minimumFractionDigits: satang % 100 ? 2 : 0, maximumFractionDigits: 2 });
  }
  function money(satang, sign) { return (sign || '') + '฿' + baht(Math.abs(satang)); }
  function approx(satang) { return money(Math.round(satang / 100) * 100); }
  function show(nodes) { app.replaceChildren.apply(app, nodes); window.scrollTo(0, 0); }
  function fail(text) { show([el('div', { class: 'card' }, [el('div', { class: 'err', text: text })])]); }

  var TH_MONTHS = ['ม.ค.', 'ก.พ.', 'มี.ค.', 'เม.ย.', 'พ.ค.', 'มิ.ย.', 'ก.ค.', 'ส.ค.', 'ก.ย.', 'ต.ค.', 'พ.ย.', 'ธ.ค.'];
  var TH_MONTHS_FULL = ['มกราคม', 'กุมภาพันธ์', 'มีนาคม', 'เมษายน', 'พฤษภาคม', 'มิถุนายน', 'กรกฎาคม', 'สิงหาคม', 'กันยายน', 'ตุลาคม', 'พฤศจิกายน', 'ธันวาคม'];
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function iso(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function parseIso(s) { var p = s.split('-'); return new Date(+p[0], +p[1] - 1, +(p[2] || 1)); }
  function todayIso() { return iso(new Date()); }
  function monthKey(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1); }
  function shiftMonth(key, n) { var d = parseIso(key + '-01'); d.setMonth(d.getMonth() + n); return monthKey(d); }
  function monthLabel(key) { var d = parseIso(key + '-01'); return TH_MONTHS_FULL[d.getMonth()] + ' ' + (d.getFullYear() + 543); }
  function dayLabel(s) {
    var t = todayIso(), y = new Date(); y.setDate(y.getDate() - 1);
    if (s === t) return 'วันนี้';
    if (s === iso(y)) return 'เมื่อวาน';
    var d = parseIso(s); return d.getDate() + ' ' + TH_MONTHS[d.getMonth()];
  }

  // ───────── icons (constant SVG markup only, never user data) ─────────
  var ICONS = {
    food: '<path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2M7 2v20M21 15V2a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3Zm0 0v7"/>',
    car: '<path d="M5 17h14v-5l-2-5H7l-2 5zM5 12h14M7 17v3M17 17v3"/>',
    bolt: '<path d="M13 2 3 14h9l-1 8 10-12h-9l1-8z"/>',
    bag: '<path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4ZM3 6h18M16 10a4 4 0 0 1-8 0"/>',
    home: '<path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2zM9 22V12h6v10"/>',
    heart: '<path d="M19 14c1.5-1.5 3-3.2 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.8 0-3 .5-4.5 2-1.5-1.5-2.7-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4 3 5.5l7 7Z"/>',
    film: '<rect x="3" y="3" width="18" height="18" rx="2"/><path d="M7 3v18M17 3v18M3 12h18"/>',
    dots: '<circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/>',
    brief: '<rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 7V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2"/>',
    laptop: '<rect x="4" y="4" width="16" height="11" rx="2"/><path d="M2 20h20"/>',
    gift: '<rect x="3" y="8" width="18" height="4" rx="1"/><path d="M12 8v13M19 12v7a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2v-7M7.5 8a2.5 2.5 0 0 1 0-5C10 3 12 8 12 8s2-5 4.5-5a2.5 2.5 0 0 1 0 5"/>',
    plus: '<path d="M12 5v14M5 12h14"/>',
    pie: '<path d="M21.2 15.9A10 10 0 1 1 8 2.8M22 12A10 10 0 0 0 12 2v10z"/>',
    list: '<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>',
    wallet: '<path d="M20 12V8H6a2 2 0 0 1 0-4h12v4M4 6v12a2 2 0 0 0 2 2h14v-4"/><path d="M18 12a2 2 0 0 0 0 4h4v-4z"/>',
    repeat: '<path d="m17 2 4 4-4 4M3 11V10a4 4 0 0 1 4-4h14M7 22l-4-4 4-4M21 13v1a4 4 0 0 1-4 4H3"/>',
    back: '<path d="m15 18-6-6 6-6"/>',
    next: '<path d="m9 18 6-6-6-6"/>',
    del: '<path d="M21 4H8l-7 8 7 8h13a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2zM18 9l-6 6M12 9l6 6"/>',
    bell: '<path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9M10.3 21a1.9 1.9 0 0 0 3.4 0"/>'
  };
  function svgIcon(name) {
    var s = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    s.setAttribute('class', 'i'); s.setAttribute('viewBox', '0 0 24 24'); s.setAttribute('aria-hidden', 'true');
    s.innerHTML = ICONS[name];
    return s;
  }
  function ibtn(name, label, onClick) {
    var b = el('button', { class: 'ib', type: 'button', 'aria-label': label, title: label }, [svgIcon(name)]);
    b.addEventListener('click', onClick);
    return b;
  }

  // Category keys match LedgerCategories on the server.
  var CATS = {
    food: ['อาหาร', 'food', '--c-food'], transport: ['เดินทาง', 'car', '--c-transport'], bills: ['บิล', 'bolt', '--c-bills'],
    shopping: ['ช้อปปิ้ง', 'bag', '--c-shopping'], housing: ['ที่พัก', 'home', '--c-housing'], health: ['สุขภาพ', 'heart', '--c-health'],
    fun: ['บันเทิง', 'film', '--c-fun'], other: ['อื่นๆ', 'dots', '--c-other'],
    salary: ['เงินเดือน', 'brief', '--c-food'], freelance: ['ฟรีแลนซ์', 'laptop', '--c-shopping'], gift: ['ของขวัญ', 'gift', '--c-bills'], other_in: ['อื่นๆ', 'dots', '--c-other']
  };
  var EXPENSE_CATS = ['food', 'transport', 'bills', 'shopping', 'housing', 'health', 'fun', 'other'];
  var INCOME_CATS = ['salary', 'freelance', 'gift', 'other_in'];
  function catName(k) { return (CATS[k] || CATS.other)[0]; }
  function catIcon(k) {
    var c = CATS[k] || CATS.other;
    var s = el('span', { class: 'ic', style: 'background:var(' + c[2] + ')' }, [svgIcon(c[1])]);
    return s;
  }
  var SOURCES = { LIFF: '', CHAT: 'แชต', SLIP: 'สลิป', SUB: 'ค่าสมาชิก' };

  // ───────── api ─────────
  function api(path, opts) {
    if (DEMO) return Demo.handle(path, opts);
    opts = opts || {};
    opts.headers = Object.assign({ Authorization: 'Bearer ' + idToken }, opts.headers || {});
    var ctl = window.AbortController ? new AbortController() : null;
    var timer = ctl ? setTimeout(function () { ctl.abort(); }, 30000) : null;
    if (ctl) opts.signal = ctl.signal;
    return fetch(API + path, opts).then(function (r) {
      clearTimeout(timer);
      return r.json().catch(function () { return {}; }).then(function (j) {
        if (!r.ok) throw new Error(j.error || ('เกิดข้อผิดพลาด (' + r.status + ')'));
        return j;
      });
    }, function (e) {
      clearTimeout(timer);
      if (e && e.name === 'AbortError') throw new Error('เซิร์ฟเวอร์ตอบช้าผิดปกติ ลองใหม่อีกครั้ง');
      throw new Error('เชื่อมต่อไม่ได้ ตรวจอินเทอร์เน็ตแล้วลองใหม่');
    });
  }

  // ───────── chrome: bar, tabs, fab, toast ─────────
  var TABS = [['home', 'หน้าแรก', 'wallet'], ['history', 'ประวัติ', 'list'], ['report', 'รายงาน', 'pie'], ['subs', 'ค่าสมาชิก', 'repeat']];

  }

  function open(tab) {

  // ───────── add / edit entry ─────────
  function openEntryForm(entry, kind) {
    chrome(null);
    var st = entry
      ? { id: entry.id, kind: entry.kind, category: entry.category, amount: String(entry.amountSatang / 100), note: entry.note || '', date: entry.date }
      : { id: null, kind: kind === 'INCOME' ? 'INCOME' : 'EXPENSE', category: kind === 'INCOME' ? 'salary' : 'food', amount: '', note: '', date: todayIso() };
    bar(entry ? 'แก้ไขรายการ' : 'จดรายการ', backToCurrent);

    var seg = el('div', { class: 'seg', role: 'group', 'aria-label': 'ประเภท' });
    var out = el('output', { class: 'num', 'aria-live': 'polite' });
    var cats = el('div', { class: 'cats' });
    var err = el('div', { class: 'err', role: 'alert' });
    var dateInp = el('input', { class: 'inp', type: 'date', id: 'f-date', value: st.date, max: todayIso() });
    var noteInp = el('input', { class: 'inp', type: 'text', id: 'f-note', maxlength: '120', placeholder: 'เช่น ข้าวมันไก่', value: st.note, enterkeyhint: 'done' });
    dateInp.addEventListener('change', function () { st.date = dateInp.value || todayIso(); });
    noteInp.addEventListener('input', function () { st.note = noteInp.value; });

    function draw() {
      seg.replaceChildren();
      [['EXPENSE', 'รายจ่าย'], ['INCOME', 'รายรับ']].forEach(function (k) {
        seg.appendChild(el('button', { type: 'button', 'aria-pressed': String(st.kind === k[0]), text: k[1], onclick: function () {
          if (st.kind === k[0]) return;
          st.kind = k[0]; st.category = k[0] === 'INCOME' ? 'salary' : 'food'; draw();
        } }));
      });
      var v = st.amount ? Number(st.amount) : 0;
      out.textContent = (st.kind === 'INCOME' ? '+' : '−') + '฿' + (st.amount ? Number(st.amount.replace(/\.$/, '')).toLocaleString('th-TH', { maximumFractionDigits: 2 }) + (/\.$/.test(st.amount) ? '.' : '') : '0');
      out.className = 'num' + (st.kind === 'INCOME' ? ' in' : '');
      cats.replaceChildren();
      (st.kind === 'INCOME' ? INCOME_CATS : EXPENSE_CATS).forEach(function (k) {
        var b = el('button', { class: 'cat', type: 'button', 'aria-pressed': String(st.category === k) }, [catIcon(k), el('span', { text: catName(k) })]);
        b.addEventListener('click', function () { st.category = k; draw(); });
        cats.appendChild(b);
      });
      save.disabled = !(v > 0);
    }

    var keys = el('div', { class: 'keys' });
    ['1', '2', '3', '4', '5', '6', '7', '8', '9', '.', '0', 'del'].forEach(function (k) {
      var b = el('button', { type: 'button', 'aria-label': k === 'del' ? 'ลบตัวเลข' : k === '.' ? 'จุดทศนิยม' : k }, [k === 'del' ? svgIcon('del') : k]);
      b.addEventListener('click', function () {
        var a = st.amount;
        if (k === 'del') a = a.slice(0, -1);
        else if (k === '.') { if (a.indexOf('.') < 0) a = (a || '0') + '.'; }
        else if (/\.\d\d$/.test(a) || a.replace('.', '').length >= 9) return;   // 2 decimals, 9 digits max
        else a = (a === '0' ? '' : a) + k;
        st.amount = a; err.textContent = ''; draw();
      });
      keys.appendChild(b);
    });

    var save = el('button', { class: 'cta', type: 'button', text: 'บันทึก' });
    save.addEventListener('click', function () {
      save.disabled = true;
      post('api/ledger/entries', { id: st.id, kind: st.kind, category: st.category, amount: Number(st.amount), note: st.note, date: st.date })
        .then(function (saved) {
          backToCurrent();
          var label = catName(saved.category) + ' ' + money(saved.amountSatang, saved.kind === 'INCOME' ? '+' : '−');
          if (st.id) toast('แก้ไขแล้ว · ' + label);
          else toast('บันทึก ' + label, 'เลิกทำ', function () {
            post('api/ledger/entries/delete', { id: saved.id }).then(function () { toast('ยกเลิกรายการแล้ว'); backToCurrent(); })
              .catch(function (e) { toast(e.message); });
          });
        })
        .catch(function (e) { err.textContent = e.message; save.disabled = false; });
    });

    var nodes = [seg,
      el('div', { class: 'amount' }, [el('small', { text: 'จำนวนเงิน (บาท)' }), out]),
      cats,
      el('div', { class: 'fields' }, [
        el('div', { class: 'field' }, [el('label', { for: 'f-date', text: 'วันที่' }), dateInp]),
        el('div', { class: 'field' }, [el('label', { for: 'f-note', text: 'โน้ต' }), noteInp])
      ]),
      keys, err, save];

    if (st.id) {
      var delBtn = el('button', { class: 'ghost danger', type: 'button', text: 'ลบรายการนี้' });
      var armed = false;
      delBtn.addEventListener('click', function () {
        if (!armed) { armed = true; delBtn.textContent = 'แตะอีกครั้งเพื่อยืนยันการลบ'; return; }
        delBtn.disabled = true;
        post('api/ledger/entries/delete', { id: st.id }).then(function () { backToCurrent(); toast('ลบรายการแล้ว'); })
          .catch(function (e) { err.textContent = e.message; delBtn.disabled = false; });
      });
      nodes.push(delBtn);
    }
    draw();
    show(nodes);
  }

  // ───────── history ─────────

  // ───────── report ─────────

  function renderReport(d) {

  // ───────── budgets ─────────

  // ───────── subscriptions ─────────
  function initialOf(name) { return (Array.from((name || '?').trim())[0] || '?').toUpperCase(); }
  function subPill(s, chargedOn) {
    if (s.inTrial) return el('span', { class: 'pill over', text: 'ทดลองฟรีถึง ' + dayLabel(s.trialEndsOn) });
    if (chargedOn) return el('span', { class: 'pill ok', text: 'ตัดแล้ว' });
    if (s.daysLeft <= 0) return el('span', { class: 'pill warn', text: 'วันนี้' });
    if (s.daysLeft <= 3) return el('span', { class: 'pill warn', text: 'อีก ' + s.daysLeft + ' วัน' });
    if (s.daysLeft <= 31) return el('span', { class: 'pill', text: 'อีก ' + s.daysLeft + ' วัน' });
    return el('span', { class: 'pill', text: dayLabel(s.nextChargeOn) });
  }

      ? 'รายปี · ' + s.day + ' ' + TH_MONTHS[(s.month || 1) - 1] + ' · ≈ ' + approx(s.monthlySatang) + '/เดือน'
      : 'ทุกวันที่ ' + s.day + ' · ' + catName(s.category);
    var b = el(onClick ? 'button' : 'div', onClick ? { class: 'tx', type: 'button' } : { class: 'tx' }, [
      el('span', { class: 'av', 'aria-hidden': 'true', text: initialOf(s.name) }),
      el('span', { class: 'grow' }, [el('span', { class: 'n', text: s.name }), el('span', { class: 's num', style: 'display:block', text: when })]),
      el('span', { class: 'v num' }, [el('span', { text: baht(s.amountSatang) + (s.cycle === 'YEARLY' ? '/ปี' : '') }), subPill(s, chargedOn)])
    ]);
    if (onClick) b.addEventListener('click', onClick);
    return b;
  }
  function loadSubs() {
    current = 'subs'; chrome('subs');
    bar('ค่าสมาชิก', null, ibtn('plus', 'เพิ่มค่าสมาชิก', function () { openSubForm(null); }));
    return load('api/ledger/subscriptions', renderSubs);
  }
  function renderSubs(d) {
    var nodes = [el('section', { class: 'sum' }, [
      el('div', {}, [el('div', { class: 'lbl', text: 'ค่าสมาชิกต่อเดือน (เฉลี่ย)' }), el('div', { class: 'big num', text: approx(d.monthlySatang) })]),
      el('div', { class: 'row' }, [
        el('div', {}, [el('span', { class: 'lbl', text: 'ต่อปี' }), el('b', { class: 'num', text: money(d.yearlySatang) })]),
        el('div', {}, [el('span', { class: 'lbl', text: 'เหลือตัดเดือนนี้' }), el('b', { class: 'num', text: money(d.leftThisMonthSatang) })])
      ])
    ])];

    d.items.filter(function (x) { return x.sub.inTrial; }).forEach(function (x) {
      var s = x.sub;
      nodes.push(el('div', { class: 'alert' }, [svgIcon('bell'), el('div', {}, [
        el('b', { text: s.name + ' ทดลองฟรีจบ ' + dayLabel(s.trialEndsOn) }),
        el('span', { text: 'หลังจากนั้นตัด ' + money(s.amountSatang) + (s.cycle === 'YEARLY' ? '/ปี' : '/เดือน') })
      ])]));
    });

    if (!d.items.length) {
      nodes.push(el('div', { class: 'card' }, [el('div', { class: 'empty' }, [
        el('span', { text: 'ยังไม่มีค่าสมาชิก เพิ่มแล้วระบบจะลงรายจ่ายให้อัตโนมัติทุกวันตัดเงิน' }),
        el('button', { class: 'cta', type: 'button', text: 'เพิ่มค่าสมาชิก', onclick: function () { openSubForm(null); } })
      ])]));
      return show(nodes);
    }
    var groups = [
      ['ตัดถัดไป', d.items.filter(function (x) { return !x.sub.inTrial && !x.chargedThisMonthOn && x.sub.cycle === 'MONTHLY'; })],
      ['ทดลองฟรี', d.items.filter(function (x) { return x.sub.inTrial; })],
      ['ตัดแล้วเดือนนี้', d.items.filter(function (x) { return !x.sub.inTrial && x.chargedThisMonthOn; })],
      ['รายปี', d.items.filter(function (x) { return !x.sub.inTrial && !x.chargedThisMonthOn && x.sub.cycle === 'YEARLY'; })]
    ];
    var card = el('section', { class: 'card', style: 'gap:4px' });
    groups.forEach(function (g) {
      if (!g[1].length) return;
      card.appendChild(el('div', { class: 'daysep', text: g[0] }));
      var list = el('div', {});
      g[1].forEach(function (x) { list.appendChild(subRow(x.sub, x.chargedThisMonthOn, function () { openSubForm(x.sub); })); });
      card.appendChild(list);
    });
    nodes.push(card);
    show(nodes);
  }

  function openSubForm(s) {
    chrome(null); bar(s ? 'แก้ไขค่าสมาชิก' : 'เพิ่มค่าสมาชิก', loadSubs);
    var st = s
      ? { id: s.id, name: s.name, amount: String(s.amountSatang / 100), cycle: s.cycle, day: s.day, month: s.month || new Date().getMonth() + 1, category: s.category, trial: !!s.inTrial, trialEndsOn: s.trialEndsOn || '' }
      : { id: null, name: '', amount: '', cycle: 'MONTHLY', day: new Date().getDate(), month: new Date().getMonth() + 1, category: 'fun', trial: false, trialEndsOn: '' };

    var name = el('input', { class: 'inp', id: 's-name', maxlength: '60', placeholder: 'เช่น Netflix', value: st.name });
    var amount = el('input', { class: 'inp num', id: 's-amount', type: 'number', inputmode: 'decimal', min: '0', step: '0.01', placeholder: '0', value: st.amount });
    var seg = el('div', { class: 'seg', role: 'group', 'aria-label': 'รอบการตัดเงิน' });
    var day = el('select', { class: 'inp', id: 's-day' });
    for (var i = 1; i <= 31; i++) day.appendChild(el('option', { value: String(i), text: 'วันที่ ' + i }));
    day.value = String(st.day);
    var mon = el('select', { class: 'inp', id: 's-month' });
    TH_MONTHS_FULL.forEach(function (m, idx) { mon.appendChild(el('option', { value: String(idx + 1), text: m })); });
    mon.value = String(st.month);
    var monField = el('div', { class: 'field' }, [el('label', { for: 's-month', text: 'เดือน' }), mon]);
    var cats = el('div', { class: 'cats' });
    var trial = el('input', { type: 'checkbox', id: 's-trial' });
    trial.checked = st.trial;
    var trialDate = el('input', { class: 'inp', type: 'date', id: 's-trial-date', min: todayIso(), value: st.trialEndsOn });
    var trialField = el('div', { class: 'field' }, [el('label', { for: 's-trial-date', text: 'ทดลองฟรีถึงวันที่' }), trialDate]);
    var err = el('div', { class: 'err', role: 'alert' });

    function draw() {
      seg.replaceChildren();
      [['MONTHLY', 'รายเดือน'], ['YEARLY', 'รายปี']].forEach(function (c) {
        seg.appendChild(el('button', { type: 'button', 'aria-pressed': String(st.cycle === c[0]), text: c[1], onclick: function () { st.cycle = c[0]; draw(); } }));
      });
      monField.hidden = st.cycle !== 'YEARLY';
      trialField.hidden = !trial.checked;
      cats.replaceChildren();
      EXPENSE_CATS.forEach(function (k) {
        var b = el('button', { class: 'cat', type: 'button', 'aria-pressed': String(st.category === k) }, [catIcon(k), el('span', { text: catName(k) })]);
        b.addEventListener('click', function () { st.category = k; draw(); });
        cats.appendChild(b);
      });
    }
    trial.addEventListener('change', draw);

    var save = el('button', { class: 'cta', type: 'button', text: 'บันทึก' });
    save.addEventListener('click', function () {
      if (!name.value.trim()) { err.textContent = 'ใส่ชื่อบริการ'; name.focus(); return; }
      if (!(Number(amount.value) > 0)) { err.textContent = 'ใส่ราคาให้ถูกต้อง'; amount.focus(); return; }
      if (trial.checked && !trialDate.value) { err.textContent = 'เลือกวันที่ทดลองฟรีหมด'; trialDate.focus(); return; }
      save.disabled = true;
      post('api/ledger/subscriptions', {
        id: st.id, name: name.value, amount: Number(amount.value), cycle: st.cycle, day: Number(day.value),
        month: st.cycle === 'YEARLY' ? Number(mon.value) : null, category: st.category, trialEndsOn: trial.checked ? trialDate.value : null
      }).then(function (r) { loadSubs(); toast((st.id ? 'แก้ไข ' : 'เพิ่ม ') + r.name + ' แล้ว · ตัดครั้งถัดไป ' + dayLabel(r.nextChargeOn)); })
        .catch(function (e) { err.textContent = e.message; save.disabled = false; });
    });

    var nodes = [el('section', { class: 'card' }, [
      el('div', { class: 'field' }, [el('label', { for: 's-name', text: 'ชื่อบริการ' }), name]),
      el('div', { class: 'field' }, [el('label', { for: 's-amount', text: 'ราคา (บาท)' }), amount]),
      el('div', { class: 'field' }, [el('span', { class: 'lbl2', text: 'รอบการตัดเงิน' }), seg]),
      el('div', { class: 'fields', style: 'grid-template-columns:1fr 1fr' }, [el('div', { class: 'field' }, [el('label', { for: 's-day', text: 'วันที่ตัด' }), day]), monField]),
      el('label', { class: 'check', for: 's-trial' }, [trial, el('span', { text: 'อยู่ในช่วงทดลองฟรี' })]),
      trialField
    ]), el('section', { class: 'card' }, [el('span', { class: 'lbl2', text: 'หมวดรายจ่าย' }), cats]), err, save];

    if (st.id) {
      var stop = el('button', { class: 'ghost danger', type: 'button', text: 'เลิกใช้บริการนี้' });
      var armed = false;
      stop.addEventListener('click', function () {
        if (!armed) { armed = true; stop.textContent = 'แตะอีกครั้งเพื่อยืนยัน (ประวัติเดิมยังอยู่)'; return; }
        stop.disabled = true;
        post('api/ledger/subscriptions/stop', { id: st.id }).then(function () { loadSubs(); toast('หยุด ' + st.name + ' แล้ว'); })
          .catch(function (e) { err.textContent = e.message; stop.disabled = false; });
      });
      nodes.push(stop);
    }
    draw();
    show(nodes);
  }

  // ───────── demo backend (?demo=1): sample data in memory, mirrors the API shapes ─────────
  var Demo = {
    seq: 100,
    init: function () {
      var t = new Date(), y = t.getFullYear(), m = t.getMonth();
      function d(day) { return iso(new Date(y, m, Math.min(day, t.getDate()))); }
      var rows = [['INCOME', 'salary', 3000000, 1, 'เงินเดือน'], ['INCOME', 'freelance', 250000, 17, 'งานโลโก้'], ['EXPENSE', 'bills', 125000, 18, 'ค่าไฟ'],
        ['EXPENSE', 'food', 6500, 18, 'กาแฟ'], ['EXPENSE', 'transport', 8400, 17, 'BTS'], ['EXPENSE', 'food', 6000, 17, 'ข้าวมันไก่'],
        ['EXPENSE', 'shopping', 21600, 17, 'เสื้อยืด'], ['EXPENSE', 'fun', 39000, 16, 'ดูหนัง'], ['EXPENSE', 'food', 610000, 10, ''],
        ['EXPENSE', 'transport', 306600, 8, 'เติมน้ำมัน'], ['EXPENSE', 'housing', 300000, 3, 'ค่าห้อง'], ['EXPENSE', 'shopping', 226400, 5, '']];
      this.entries = rows.map(function (r, i) { return { id: i + 1, kind: r[0], category: r[1], amountSatang: r[2], date: d(r[3]), note: r[4] || null, source: i === 2 ? 'SLIP' : 'LIFF' }; });
      this.budgets = [{ category: 'food', limitSatang: 800000 }, { category: 'transport', limitSatang: 300000 }, { category: 'shopping', limitSatang: 400000 }];
      function sub(id, name, amt, cycle, day, mon, next, trial, cat) {
        var nd = parseIso(next), dl = Math.round((nd - new Date(y, m, t.getDate())) / 864e5);
        return { id: id, name: name, category: cat || 'fun', amountSatang: amt, monthlySatang: cycle === 'YEARLY' ? Math.round(amt / 12) : amt, cycle: cycle, day: day, month: mon,
          nextChargeOn: next, daysLeft: dl, trialEndsOn: trial, inTrial: !!trial };
      }
      function inDays(n) { return iso(new Date(y, m, t.getDate() + n)); }
      this.subs = [
        { sub: sub(1, 'Spotify', 12900, 'MONTHLY', parseIso(inDays(2)).getDate(), null, inDays(2)), chargedThisMonthOn: null },
        { sub: sub(2, 'iCloud+ 200GB', 3500, 'MONTHLY', parseIso(inDays(4)).getDate(), null, inDays(4)), chargedThisMonthOn: null },
        { sub: sub(3, 'ฟิตเนส', 120000, 'MONTHLY', 1, null, iso(new Date(y, m + 1, 1)), null, 'health'), chargedThisMonthOn: iso(new Date(y, m, 1)) },
        { sub: sub(4, 'Netflix Premium', 41900, 'MONTHLY', 5, null, iso(new Date(y, m + 1, 5))), chargedThisMonthOn: iso(new Date(y, m, 5)) },
        { sub: sub(5, 'Adobe Creative Cloud', 760000, 'YEARLY', 12, 3, iso(new Date(y + 1, 2, 12)), null, 'other'), chargedThisMonthOn: null },
        { sub: sub(6, 'Canva Pro', 30000, 'MONTHLY', parseIso(inDays(6)).getDate(), null, inDays(6), inDays(6)), chargedThisMonthOn: null }
      ];
    },
    month: function (path) { var m = /month=(\d{4}-\d{2})/.exec(path); return m ? m[1] : monthKey(new Date()); },
    handle: function (path, opts) {
      var self = this, body = opts && opts.body ? JSON.parse(opts.body) : null;
      return new Promise(function (res, rej) { setTimeout(function () { try { res(self.route(path, body)); } catch (e) { rej(e); } }, 120); });
    },
    route: function (path, b) {
      var mk = this.month(path), inMonth = this.entries.filter(function (e) { return e.date.slice(0, 7) === mk; });
      function total(kind, list) { return list.filter(function (e) { return e.kind === kind; }).reduce(function (s, e) { return s + e.amountSatang; }, 0); }
      var monthly = this.subs.reduce(function (s, x) { return s + x.sub.monthlySatang; }, 0);
      if (path.indexOf('api/ledger/home') === 0) {
        var sorted = this.entries.slice().sort(function (a, c) { return a.date < c.date ? 1 : a.date > c.date ? -1 : c.id - a.id; });
        var next = this.subs.map(function (x) { return x.sub; }).sort(function (a, c) { return a.daysLeft - c.daysLeft; })[0];
        return { month: mk, incomeSatang: total('INCOME', inMonth), expenseSatang: total('EXPENSE', inMonth),
          budgets: this.budgets.map(function (bg) { return { category: bg.category, limitSatang: bg.limitSatang, spentSatang: inMonth.filter(function (e) { return e.kind === 'EXPENSE' && e.category === bg.category; }).reduce(function (s, e) { return s + e.amountSatang; }, 0) }; }),
          subscriptions: { count: this.subs.length, monthlySatang: monthly, next: next }, recent: sorted.slice(0, 5) };
      }
      if (path.indexOf('api/ledger/entries/delete') === 0) { this.entries = this.entries.filter(function (e) { return e.id !== b.id; }); return { deleted: true }; }
      if (path.indexOf('api/ledger/entries') === 0 && b) {
        var e = b.id ? this.entries.filter(function (x) { return x.id === b.id; })[0] : { id: ++this.seq, source: 'LIFF' };
        if (!b.id) this.entries.push(e);
        e.kind = b.kind; e.category = b.category; e.amountSatang = Math.round(b.amount * 100); e.note = (b.note || '').trim() || null; e.date = b.date;
        return e;
      }
      if (path.indexOf('api/ledger/entries') === 0) {
        return { month: mk, entries: inMonth.slice().sort(function (a, c) { return a.date < c.date ? 1 : a.date > c.date ? -1 : c.id - a.id; }) };
      }
      if (path.indexOf('api/ledger/report') === 0) {
        var exp = inMonth.filter(function (e) { return e.kind === 'EXPENSE'; }), by = {}, days = new Date(+mk.slice(0, 4), +mk.slice(5), 0).getDate(), byDay = [];
        exp.forEach(function (e) { by[e.category] = (by[e.category] || 0) + e.amountSatang; });
        for (var i = 1; i <= days; i++) byDay.push({ day: i, satang: exp.filter(function (e) { return +e.date.slice(8) === i; }).reduce(function (s, e) { return s + e.amountSatang; }, 0) });
        var elapsed = mk === monthKey(new Date()) ? new Date().getDate() : days;
        return { month: mk, incomeSatang: total('INCOME', inMonth), expenseSatang: total('EXPENSE', inMonth), avgPerDaySatang: Math.floor(total('EXPENSE', inMonth) / elapsed),
          byCategory: Object.keys(by).map(function (k) { return { category: k, satang: by[k] }; }).sort(function (a, c) { return c.satang - a.satang; }), byDay: byDay };
      }
      if (path.indexOf('api/ledger/budgets') === 0) { this.budgets = b.items.filter(function (i) { return i.limit > 0; }).map(function (i) { return { category: i.category, limitSatang: Math.round(i.limit * 100) }; }); return { saved: true }; }
      if (path.indexOf('api/ledger/subscriptions/stop') === 0) { this.subs = this.subs.filter(function (x) { return x.sub.id !== b.id; }); return { stopped: true }; }
      if (path.indexOf('api/ledger/subscriptions') === 0 && b) {
        var found = b.id ? this.subs.filter(function (x) { return x.sub.id === b.id; })[0] : null;
        var amt = Math.round(b.amount * 100), t = new Date(), nd = new Date(t.getFullYear(), t.getMonth(), b.day);
        if (nd < new Date(t.getFullYear(), t.getMonth(), t.getDate())) nd.setMonth(nd.getMonth() + 1);
        var s = { id: b.id || ++this.seq, name: b.name.trim(), category: b.category, amountSatang: amt, monthlySatang: b.cycle === 'YEARLY' ? Math.round(amt / 12) : amt, cycle: b.cycle, day: b.day, month: b.month,
          nextChargeOn: b.trialEndsOn || iso(nd), daysLeft: Math.round(((b.trialEndsOn ? parseIso(b.trialEndsOn) : nd) - new Date(t.getFullYear(), t.getMonth(), t.getDate())) / 864e5), trialEndsOn: b.trialEndsOn, inTrial: !!b.trialEndsOn };
        if (found) found.sub = s; else this.subs.push({ sub: s, chargedThisMonthOn: null });
        return s;
      }
      if (path.indexOf('api/ledger/subscriptions') === 0) {
        var items = this.subs.slice().sort(function (a, c) { return a.sub.daysLeft - c.sub.daysLeft; });
        return { monthlySatang: monthly, yearlySatang: this.subs.reduce(function (s, x) { return s + (x.sub.cycle === 'YEARLY' ? x.sub.amountSatang : x.sub.amountSatang * 12); }, 0),
          leftThisMonthSatang: this.subs.filter(function (x) { return !x.chargedThisMonthOn && !x.sub.inTrial && x.sub.cycle === 'MONTHLY' && x.sub.nextChargeOn.slice(0, 7) === monthKey(new Date()); }).reduce(function (s, x) { return s + x.sub.amountSatang; }, 0),
          items: items };
      }
      throw new Error('demo: unknown ' + path);
    }
  };

  // ───────── start ─────────
  buildTabs();
  function start(q) {
    var tab = q && q.get('tab');
    if (tab === 'new') { current = 'home'; return openEntryForm(null, q.get('kind') === 'income' ? 'INCOME' : 'EXPENSE'); }
    if (tab === 'budget') {   // rich menu: straight to the budget form, back goes to the home screen
      current = 'home'; chrome(null);
      return api('api/ledger/home?month=' + month).then(function (d) { openBudgets(d.budgets); }).catch(function (e) { fail(e.message); });
    }
    return open(['home', 'history', 'report', 'subs'].indexOf(tab) >= 0 ? tab : 'home');
  }
  if (DEMO) { Demo.init(); start(new URLSearchParams(location.search)); return; }

  fetch(API + 'api/config').then(function (r) { return r.json(); }).then(function (cfg) {
    return liff.init({ liffId: cfg.liffId });
  }).then(function () {
    if (!liff.isLoggedIn()) { liff.login(); return; }
    idToken = liff.getIDToken();
    if (!idToken) { fail('ไม่พบข้อมูลผู้ใช้ ลองเปิดจากแอป LINE อีกครั้ง'); return; }
    // ?tab=new | history | report | subs (rich menu buttons); liff.state carries it on the first open
    var q = new URLSearchParams(location.search);
    var st = q.get('liff.state') ? new URLSearchParams(q.get('liff.state').replace(/^[^?]*\?/, '')) : null;
    return start(st && st.get('tab') ? st : q);
  }).catch(function (e) { fail(e.message || 'โหลดไม่สำเร็จ'); });
})();
</script>
